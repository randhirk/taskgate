[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskgate"
version = "0.1.0"
description = "Fail CI when an AI agent task costs more, calls more tools, or repeats a mutation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "taskgate contributors" }]
keywords = ["ai", "agents", "llm", "ci", "mcp", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = ["tomli>=2.0.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taskgate = "taskgate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
